<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Lamp Screensaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b1a30; /* Deep Plum Background */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <canvas id="lavalamp"></canvas>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const BLOB_COUNT = 8;
        const TIME_SPEED = 0.2;
        const DRIFT_SPEED = 0.5;
        const GLOW_STRENGTH = 0.8;
        
        // Shader Vertex Code
        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vPos;
            void main() {
                vUv = uv;
                vPos = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        // Shader Fragment Code (Raymarching SDF)
        const fragmentShader = `
            varying vec2 vUv;
            varying vec3 vPos;

            // Uniforms
            uniform float uTime;
            uniform vec3 uColors[8]; // 8 blobs max
            uniform vec3 uPositions[8];
            uniform vec3 uVelocities[8];
            uniform vec2 uResolution;
            uniform float uGlow;

            // SDF Math
            float sdBox(vec3 p, vec3 b) {
                vec3 q = abs(p) - b;
                return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
            }

            // Signed Distance Field for a Blob (Sphere)
            float sphere(vec3 p, float r) {
                return length(p) - r;
            }

            // Smooth Union of two spheres (Metaball logic)
            float smoothUnion(float a, float b, float k) {
                float h = clamp(0.5 * (b - a + k), 0.0, 1.0);
                return mix(b, a, h) - k * h * (1.0 - h);
            }

            // Raymarching
            float rayMarch(vec3 ro, vec3 rd) {
                float d = 0.0;
                float t = 0.0;
                float sumDist = 0.0;
                
                // 20 steps
                for(int i = 0; i < 20; i++) {
                    vec3 p = ro + rd * t;
                    float dMin = 1000.0;
                    
                    // Calculate distance to each blob
                    for(int i = 0; i < 8; i++) {
                        vec3 diff = p - uPositions[i];
                        // Dynamic radius based on time and velocity
                        float r = 0.8 + 0.4 * sin(uTime * 0.5 + i * 0.5); 
                        float dist = sphere(diff, r);
                        dMin = min(dMin, dist);
                    }
                    
                    if (dMin < 0.001) break;
                    t += dMin;
                }
                return t;
            }

            // Lighting & Shading
            vec3 getNormal(vec3 p) {
                vec3 q = vec3(0.001, 0.0, 0.0);
                vec3 n = vec3(
                    sphere(p + q, 0.8) - sphere(p - q, 0.8),
                    sphere(p + q.yzx, 0.8) - sphere(p - q.yzx, 0.8),
                    sphere(p + q.zxy, 0.8) - sphere(p - q.zxy, 0.8)
                );
                return normalize(n);
            }

            void main() {
                // Ray generation
                vec2 uv = (gl_FragCoord.xy / uResolution) * 2.0 - 1.0;
                uv.x *= uResolution.x / uResolution.y;
                
                vec3 ro = vec3(0.0, 0.0, -4.0); // Camera position
                vec3 rd = normalize(vec3(uv.x, uv.y, 1.0));
                
                // Simple camera look rotation
                float rot = uTime * 0.1;
                mat3 rotMat = mat3(
                    cos(rot), 0.0, sin(rot),
                    0.0, 1.0, 0.0,
                    -sin(rot), 0.0, cos(rot)
                );
                ro = rotMat * ro;
                rd = rotMat * rd;

                // Raymarching
                float t = rayMarch(ro, rd);
                
                // Calculate Normal for lighting
                vec3 p = ro + rd * t;
                vec3 n = getNormal(p);
                
                // Lighting
                vec3 lightPos = vec3(0.0, 5.0, 2.0);
                vec3 lightDir = normalize(lightPos - p);
                vec3 viewDir = normalize(-rd);
                
                // Ambient
                vec3 color = vec3(0.0);
                float ambient = 0.4;
                
                // Diffuse
                float diff = max(dot(n, lightDir), 0.0);
                
                // Specular
                vec3 reflectDir = reflect(-lightDir, n);
                float spec = pow(max(dot(viewDir, reflectDir), 0.0), 30.0);
                
                // Color Selection based on noise/space
                // We pick a color based on the position to create gradients within the blobs
                vec3 selectedColor = uColors[0];
                float noise = sin(p.x * 10.0 + uTime) * 0.5 + 0.5;
                
                // Map noise to color palette (Orange to Red/Purple)
                selectedColor = mix(vec3(0.0, 0.4, 0.6), vec3(1.0, 0.6, 0.1), noise);
                
                // Apply Lighting
                color = selectedColor * (ambient + diff) + vec3(spec * 0.8);
                
                // Add Glow/Inner Light
                color += selectedColor * uGlow * 0.5;

                // Distance fog (fade to background)
                float fog = 1.0 - clamp(t / 12.0, 0.0, 1.0);
                color = mix(vec3(0.16, 0.1, 0.2), color, fog);

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        class LavaLamp {
            constructor() {
                this.canvas = document.getElementById('lavalamp');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                
                // Scene setup
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x2b1a30);
                
                this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 100);
                this.camera.position.z = 1;

                this.uniforms = {
                    uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(this.width, this.height) },
                    uGlow: { value: GLOW_STRENGTH }
                };

                this.initBlobs();
                this.initMesh();
                
                window.addEventListener('resize', this.onResize.bind(this));
                requestAnimationFrame(this.animate.bind(this));
            }

            initBlobs() {
                // Initialize random positions and velocities for blobs
                this.blobData = [];
                const palette = [
                    new THREE.Color(0xff7e00), // Orange
                    new THREE.Color(0xff4500), // Red-Orange
                    new THREE.Color(0xcc0033), // Red
                    new THREE.Color(0x880033), // Deep Red
                ];

                for (let i = 0; i < BLOB_COUNT; i++) {
                    // Random 3D position
                    const x = (Math.random() - 0.5) * 4;
                    const y = (Math.random() - 0.5) * 4;
                    const z = (Math.random() - 0.5) * 4;
                    
                    // Random velocity (drift)
                    const vx = (Math.random() - 0.5) * DRIFT_SPEED;
                    const vy = (Math.random() - 0.5) * DRIFT_SPEED;
                    const vz = (Math.random() - 0.5) * DRIFT_SPEED;

                    this.blobData.push({
                        pos: new THREE.Vector3(x, y, z),
                        vel: new THREE.Vector3(vx, vy, vz),
                        color: palette[Math.floor(Math.random() * palette.length)],
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            initMesh() {
                // A simple plane that fills the screen to act as the canvas for the shader
                const geometry = new THREE.PlaneGeometry(2, 2);
                const material = new THREE.ShaderMaterial({
                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader,
                    uniforms: this.uniforms
                });

                this.mesh = new THREE.Mesh(geometry, material);
                this.scene.add(this.mesh);
            }

            updateBlobs(time) {
                const positions = new Float32Array(BLOB_COUNT * 3);
                const velocities = new Float32Array(BLOB_COUNT * 3);
                const colors = new Float32Array(BLOB_COUNT * 3);

                // Update physics
                this.blobData.forEach((blob, i) => {
                    // Move
                    blob.pos.add(blob.vel);

                    // Simple boundary bounce (keep them in the view)
                    const limit = 3.5;
                    if (Math.abs(blob.pos.x) > limit) blob.vel.x *= -1;
                    if (Math.abs(blob.pos.y) > limit) blob.vel.y *= -1;
                    if (Math.abs(blob.pos.z) > limit) blob.vel.z *= -1;

                    // Fill uniforms
                    positions[i * 3] = blob.pos.x;
                    positions[i * 3 + 1] = blob.pos.y;
                    positions[i * 3 + 2] = blob.pos.z;

                    velocities[i * 3] = blob.vel.x;
                    velocities[i * 3 + 1] = blob.vel.y;
                    velocities[i * 3 + 2] = blob.vel.z;

                    colors[i * 3] = blob.color.r;
                    colors[i * 3 + 1] = blob.color.g;
                    colors[i * 3 + 2] = blob.color.b;
                });

                this.uniforms.uPositions = { value: new Float32Array(positions) };
                this.uniforms.uVelocities = { value: new Float32Array(velocities) };
                this.uniforms.uColors = { value: new Float32Array(colors) };
            }

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                
                const time = this.uniforms.uTime.value = THREE.Clock.getElapsedTime();
                
                // Update blob physics
                this.updateBlobs(time);

                // Render
                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    antialias: true,
                    powerPreference: "high-performance"
                });
                
                // We only need to create the renderer once, but checking if it exists is safer
                if (!this.renderer) {
                    this.renderer = new THREE.WebGLRenderer({
                        canvas: this.canvas,
                        antialias: true
                    });
                }
                
                this.renderer.setSize(this.width, this.height);
                this.renderer.render(this.scene, this.camera);
            }

            onResize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.uniforms.uResolution.value.set(this.width, this.height);
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                
                if (this.renderer) {
                    this.renderer.setSize(this.width, this.height);
                }
            }
        }

        // Initialize
        window.onload = () => {
            new LavaLamp();
        };
    </script>
</body>
</html>
