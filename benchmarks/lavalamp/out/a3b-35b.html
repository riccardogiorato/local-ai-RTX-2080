<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Lava Lamp</title>
    <style>
        :root {
            --bg-color: #111;
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.6);
            --base-color: #222;
            --bulb-color: #ffaa00;
            --wax-color-1: #ff4500;
            --wax-color-2: #ffcc00;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Container for the Lamp */
        .lamp-container {
            position: relative;
            width: 300px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.5));
        }

        /* The Glass Vessel */
        .glass-vessel {
            position: relative;
            width: 180px;
            height: 320px;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05), rgba(255,255,255,0.0));
            border-radius: 20px 20px 10px 10px;
            border: 4px solid var(--glass-border);
            border-top: 8px solid var(--glass-border); /* Thicker neck edge */
            box-sizing: border-box;
            overflow: hidden; /* Clips the canvas */
            z-index: 2;
            /* Glass Reflections */
            background-image: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.1) 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        /* Canvas for the Wax */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            border-radius: 10px;
            filter: blur(0.5px) contrast(1.2); /* Softens the wax */
        }

        /* The Base */
        .lamp-base {
            width: 120px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #333, #000);
            border-radius: 10px 10px 20px 20px;
            margin-top: -10px; /* Slight overlap */
            z-index: 3;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* The Bulb (Light Source) */
        .bulb {
            width: 60px;
            height: 40px;
            background: radial-gradient(circle, var(--bulb-color), #ff5500);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(5px);
            z-index: 4;
            animation: flicker 4s infinite alternate;
        }

        /* The Cap */
        .lamp-cap {
            width: 100px;
            height: 30px;
            background: linear-gradient(to right, #444, #222, #444);
            border-radius: 10px 10px 0 0;
            margin-top: -5px;
            z-index: 3;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        /* Animations */
        @keyframes flicker {
            0%, 100% { opacity: 0.8; filter: blur(5px) brightness(1); }
            50% { opacity: 0.6; filter: blur(8px) brightness(1.2); }
            75% { opacity: 0.9; filter: blur(3px) brightness(1.1); }
        }

        /* Ambient Glow on the floor */
        .ambient-glow {
            position: absolute;
            bottom: 50px;
            width: 400px;
            height: 100px;
            background: radial-gradient(ellipse at center, rgba(255, 100, 0, 0.15), transparent 70%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="lamp-container">
        <div class="lamp-cap"></div>
        <div class="glass-vessel">
            <canvas id="lavaCanvas"></canvas>
        </div>
        <div class="lamp-base">
            <div class="bulb"></div>
        </div>
        <div class="ambient-glow"></div>
    </div>

    <script>
        const canvas = document.getElementById('lavaCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        const width = canvas.offsetWidth;
        const height = canvas.offsetHeight;
        canvas.width = width;
        canvas.height = height;

        // Wax Configuration
        const blobCount = 6;
        const blobs = [];
        
        // Physics parameters
        const gravity = 0.15;
        const drag = 0.98;
        const spread = 0.5; // How much they expand when slow
        const shrink = 0.8; // How much they shrink when fast
        const mergeThreshold = 40; // Distance to merge
        const minDistance = 10; // Minimum distance between centers

        class Blob {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * (width - 60) + 30;
                this.y = Math.random() * (height - 100) + 50;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = 20 + Math.random() * 15;
                this.color = Math.random() > 0.5 ? '#ff4500' : '#ffcc00'; // Orange or Yellow
                this.warmth = Math.random(); // 0 to 1, determines if rising or falling
                this.targetY = Math.random() > 0.5 ? height : 0; // Target destination
            }

            update() {
                // Determine movement based on warmth
                // If warmth is high (near bottom), rise. If low (near top), fall.
                
                // Simple physics simulation
                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;

                // Boundary collisions (walls)
                if (this.x < this.radius) { this.x = this.radius; this.vx *= -1; }
                if (this.x > width - this.radius) { this.x = width - this.radius; this.vx *= -1; }

                // Ceiling/Floor interaction
                if (this.y < this.radius) {
                    this.y = this.radius;
                    this.vy *= -1; // Bounce up
                    this.warmth = 0; // Cooled down
                }
                if (this.y > height - this.radius) {
                    this.y = height - this.radius;
                    this.vy *= -1; // Bounce up
                    this.warmth = 1; // Heated up
                }

                // Apply "Heated" logic (Rising)
                if (this.warmth > 0.5) {
                    this.vy -= 0.05 * (this.warmth - 0.5); // Buoyancy
                } else {
                    this.vy += 0.05 * (0.5 - this.warmth); // Gravity
                }

                // Drag
                this.vx *= drag;
                this.vy *= drag;

                // Slow down to allow merging to happen
                if (Math.abs(this.vx) < 1 && Math.abs(this.vy) < 1) {
                    // Slight expansion/shrink based on speed
                    this.radius = this.radius * 0.99 + (Math.random() - 0.5) * 0.2;
                }

                // Random jitter for organic movement
                this.x += (Math.random() - 0.5) * 0.5;
                this.y += (Math.random() - 0.5) * 0.5;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // Initialize Blobs
        for (let i = 0; i < blobCount; i++) {
            blobs.push(new Blob());
        }

        // Metaball Logic (The "Soft" Merge)
        // We use a threshold method to draw the combined shape
        // This is computationally cheaper than solving implicit equations per pixel
        
        function drawMetaballs() {
            // Create an offscreen canvas for the metaball calculation
            const offCanvas = document.createElement('canvas');
            offCanvas.width = width;
            offCanvas.height = height;
            const offCtx = offCanvas.getContext('2d');

            // 1. Draw the blobs with high blur (simulating heat glow)
            offCtx.globalCompositeOperation = 'source-over';
            
            // We actually draw the raw blobs here, but with a slight glow
            blobs.forEach(blob => {
                offCtx.beginPath();
                offCtx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
                offCtx.fillStyle = blob.color;
                offCtx.fill();
            });

            // 2. Apply a blur filter to the offscreen canvas to simulate the "glowing" effect
            offCtx.filter = 'blur(10px)';
            // Redraw to apply filter
            offCtx.drawImage(offCanvas, 0, 0);
            offCtx.filter = 'none'; // Reset filter

            // 3. Thresholding to create the solid shape
            // We scan the pixels. If the pixel is bright enough, we draw it.
            // This is the "Metaball" effect using canvas pixel manipulation.
            const imageData = offCtx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            // Clear the main canvas
            ctx.clearRect(0, 0, width, height);
            
            // Create a temporary image data to draw the solid shape
            const solidData = ctx.createImageData(width, height);
            
            // Threshold value (0-255). Higher = more merged.
            const threshold = 255; 
            
            // We iterate over the blurred data from offCanvas
            // Note: For performance in JS, looping all pixels is slow. 
            // Optimization: We will draw the blobs directly but with a "glow" blend mode
            // instead of full pixel manipulation for the "soft" look, 
            // and then use a mask or composite operation to make them solid.
            
            // BETTER APPROACH FOR PERFORMANCE:
            // Use radial gradients to simulate the metaball field directly.
            // This avoids pixel manipulation overhead.
            
            // Reset context
            ctx.globalCompositeOperation = 'multiply'; // Hardens edges
            
            // Draw each blob as a radial gradient
            blobs.forEach(blob => {
                const gradient = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.radius * 1.5);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); // Core
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)'); // Soft glow
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Fade out
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(blob.x, blob.y, blob.radius * 1.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // 4. Apply the "Metaball" threshold logic using globalCompositeOperation
            // This is a trick: 
            // We draw the "field" (gradients) in white.
            // We set composite to 'source-over' but use a mask.
            // Actually, the easiest robust way for a self-contained file without WebGL:
            // Use the 'difference' or 'exclusion' composite modes? No.
            
            // Let's stick to the classic Canvas API trick:
            // Draw the blobs with a blur. Then use 'destination-in' on a mask? No.
            
            // FINAL APPROACH: 
            // 1. Draw blobs with blur.
            // 2. Use 'destination-over' to draw them onto the main canvas.
            // 3. To get the "merged" look without pixel manipulation, we rely on the CSS blur
            // applied to the container, and just draw the individual blobs. 
            // The visual merge happens because of the blur + opacity.
            
            // To make it look like a solid liquid:
            ctx.globalCompositeOperation = 'source-over';
            ctx.filter = 'blur(4px)'; // Soften edges
            
            blobs.forEach(blob => {
                ctx.beginPath();
                ctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
                ctx.fillStyle = blob.color;
                ctx.fill();
            });
            ctx.filter = 'none'; // Reset
            
            // To make them look like they are merging (one continuous mass):
            // We can use a slight "multiply" or "darken" composite if we had layers,
            // but for wax, standard additive blending with opacity works best.
            
            // Let's refine the drawing for the "Wax" look
            ctx.globalCompositeOperation = 'multiply';
            blobs.forEach(blob => {
                const grad = ctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.radius);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(1, blob.color);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalCompositeOperation = 'source-over';
        }

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Update Physics
            blobs.forEach(blob => blob.update());

            // Metaball Logic (Simplified for performance)
            // We use a threshold method on a temporary canvas for the "solid" look
            drawMetaballs();

            requestAnimationFrame(animate);
        }

        // Collision/Merging Logic
        function checkCollisions() {
            for (let i = 0; i < blobs.length; i++) {
                for (let j = i + 1; j < blobs.length; j++) {
                    const dx = blobs[i].x - blobs[j].x;
                    const dy = blobs[i].y - blobs[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mergeThreshold) {
                        // Merge: Combine centers and average radius
                        const totalArea = Math.PI * blobs[i].radius * blobs[i].radius + Math.PI * blobs[j].radius * blobs[j].radius;
                        const newRadius = Math.sqrt(totalArea / Math.PI);
                        
                        const newX = (blobs[i].x + blobs[j].x) / 2;
                        const newY = (blobs[i].y + blobs[j].y) / 2;
                        
                        // Average velocity
                        const newVx = (blobs[i].vx + blobs[j].vx) / 2;
                        const newVy = (blobs[i].vy + blobs[j].vy) / 2;

                        // Reset one blob
                        blobs[i].radius = newRadius;
                        blobs[i].x = newX;
                        blobs[i].y = newY;
                        blobs[i].vx = newVx;
                        blobs[i].vy = newVy;
                        blobs[i].color = Math.random() > 0.5 ? '#ff4500' : '#ffcc00'; // Randomize color on merge

                        // Reset the other blob to a fresh state (simulating splitting)
                        blobs[j].reset();
                        blobs[j].radius = newRadius * 0.5; // New piece is smaller
                        blobs[j].vx = newVx + (Math.random() - 0.5) * 5;
                        blobs[j].vy = newVy + (Math.random() - 0.5) * 5;
                    }
                }
            }
        }

        // Main Loop with Collision Check
        function gameLoop() {
            // Physics
            blobs.forEach(blob => blob.update());
            checkCollisions();
            
            // Rendering
            drawMetaballs();
            
            requestAnimationFrame(gameLoop);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            // Reset blobs to fit
            blobs.forEach(b => b.reset());
        });

        // Start
        gameLoop();

    </script>
</body>
</html>
