<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Lamp Animation</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --lamp-body: rgba(255, 255, 255, 0.05);
            --lamp-border: rgba(255, 255, 255, 0.1);
            --lamp-highlight: rgba(255, 255, 255, 0.15);
            --liquid-base: #ff9f1c;
            --liquid-warm: #ffbf69;
            --liquid-cool: #2ec4b6;
            --bulb-glow: #ff4e50;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .lamp-container {
            position: relative;
            width: 300px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The Glass Vessel */
        .lamp-glass {
            position: relative;
            width: 260px;
            height: 500px;
            background: linear-gradient(to right, rgba(255,255,255,0.1), rgba(255,255,255,0.05), rgba(255,255,255,0.1));
            border-radius: 140px 140px 60px 60px;
            box-shadow: 
                inset -10px 0 20px rgba(0,0,0,0.5),
                inset 10px 0 20px rgba(255,255,255,0.05),
                0 0 0 2px rgba(255,255,255,0.1),
                0 20px 50px rgba(0,0,0,0.6);
            z-index: 10;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* The Neck */
        .lamp-neck {
            position: absolute;
            top: 10px;
            width: 120px;
            height: 120px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.05), rgba(255,255,255,0.1));
            border-radius: 60px 60px 10px 10px;
            z-index: 11;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.2);
        }

        /* The Cap */
        .lamp-cap {
            position: absolute;
            top: -25px;
            width: 100px;
            height: 30px;
            background: #e0e0e0;
            border-radius: 4px;
            z-index: 12;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .lamp-cap::after {
            content: '';
            width: 40px;
            height: 10px;
            background: #ccc;
            border-radius: 5px;
        }

        /* The Bulb Glow (Behind Glass) */
        .bulb-glow {
            position: absolute;
            bottom: -20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255, 159, 28, 0.8) 0%, rgba(255, 79, 80, 0.2) 70%, transparent 100%);
            border-radius: 50%;
            z-index: 5;
            filter: blur(10px);
            animation: bulbPulse 4s infinite ease-in-out;
        }

        @keyframes bulbPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* The Liquid Layer (Static Base) */
        .liquid-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top, #ff9f1c, #ffbf69);
            border-radius: 100px 100px 0 0;
            z-index: 5;
            opacity: 0.9;
        }

        /* Wax Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            z-index: 6;
            opacity: 0.9;
            mix-blend-mode: multiply;
        }

        /* Reflections on Glass */
        .reflection {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg, 
                rgba(255,255,255,0.1) 0%, 
                rgba(255,255,255,0.05) 40%, 
                rgba(255,255,255,0.02) 100%
            );
            pointer-events: none;
            z-index: 20;
            border-radius: 140px 140px 60px 60px;
        }
        
        .reflection-shine {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 40%;
            height: 20%;
            background: linear-gradient(to right, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            border-radius: 50%;
            transform: rotate(-45deg);
            z-index: 21;
            opacity: 0.6;
        }

        /* Animation Keyframes */
        @keyframes rise {
            0% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-300px) scale(1.1); }
            100% { transform: translateY(-500px) scale(0.8); }
        }

        @keyframes fall {
            0% { transform: translateY(-500px) scale(0.8); }
            40% { transform: translateY(-200px) scale(1.2); }
            100% { transform: translateY(0) scale(1); }
        }

        @keyframes merge {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="lamp-container">
        <div class="lamp-cap"></div>
        <div class="lamp-neck"></div>
        
        <div class="lamp-glass">
            <div class="bulb-glow"></div>
            <div class="liquid-base"></div>
            
            <!-- Wax Blobs will be injected here via JS -->
            
            <div class="reflection">
                <div class="reflection-shine"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const blobCount = 6;
        const blobs = [];
        const colors = ['#ff9f1c', '#ffbf69', '#ff4e50']; // Orange, Yellow, Red

        // Blob Class
        class Blob {
            constructor(container) {
                this.element = document.createElement('div');
                this.element.classList.add('blob');
                container.appendChild(this.element);
                
                this.reset();
            }

            reset() {
                // Random Size
                const size = 30 + Math.random() * 40;
                this.element.style.width = `${size}px`;
                this.element.style.height = `${size}px`;

                // Random Color
                this.element.style.background = `radial-gradient(circle at 30% 30%, ${colors[Math.floor(Math.random() * colors.length)]}, rgba(255,255,255,0.4))`;

                // Start Position (Bottom)
                this.y = 0;
                this.targetY = 0;
                this.speed = 0.5 + Math.random() * 0.8;
                this.direction = 1; // 1 up, -1 down
                this.radius = size / 2;

                // Animation State
                this.isMoving = false;
                this.animationId = null;
                this.phase = 'rising'; // rising, falling, merging
            }

            update() {
                if (this.phase === 'rising') {
                    this.y -= this.speed;
                    if (this.y < -this.radius * 2) {
                        this.y = -this.radius * 2;
                        this.phase = 'falling';
                        this.direction = -1;
                        // Reset speed for falling
                        this.speed = 1.5 + Math.random() * 1.5; 
                    }
                } else if (this.phase === 'falling') {
                    this.y += this.speed;
                    if (this.y > 0) {
                        this.y = 0;
                        this.phase = 'rising';
                        this.direction = 1;
                        // Reset speed for rising
                        this.speed = 0.5 + Math.random() * 0.8;
                    }
                }

                // Apply transform
                this.element.style.transform = `translateY(${this.y}px) scale(${1 + (Math.sin(Date.now() / 1000) * 0.1)})`;
            }
        }

        // Initialize Blobs
        for (let i = 0; i < blobCount; i++) {
            // Start at bottom
            const blob = new Blob(document.querySelector('.lamp-glass'));
            blob.y = 0;
            blobs.push(blob);
        }

        // Animation Loop
        function animate() {
            blobs.forEach(blob => blob.update());
            requestAnimationFrame(animate);
        }

        animate();

    </script>
</body>
</html>
